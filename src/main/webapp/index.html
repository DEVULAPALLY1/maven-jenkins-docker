<!DOCTYPE html>
<html>
<head>
    <title>user regis</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .form-container {
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: blue;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-row label {
            width: 70px;
            margin-right: 10px;
        }

        .form-row input {
            flex: 1;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            display: block;
            width: calc(100% - 80px);
            margin-left: 80px;
            padding: 10px;
            box-sizing: border-box;
            cursor: pointer;
            color: white;
            background-color: mediumseagreen;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>User Registration</h1>

        <form action="userRegistration" method="post">

            <div class="form-row">
                <label for="name">Name:</label>
                <input type="text"
                       id="name"
                       name="name"
                       required>
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </div>

            <button type="submit">Done</button>
        </form>

    </div>

</body>
</html>
